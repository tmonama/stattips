services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statssa"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: statssa
      POSTGRES_USER: statssa
      POSTGRES_PASSWORD: statssa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: